# Production — Raspberry Pi 5 (arbitrage D3 : hébergement maison au lieu
# d'une instance cloud UE, décision du 16 octobre 2026).
#
# À lancer depuis la racine du dépôt cloné sur le Pi (le .env s'y trouve) :
#   docker compose -f deploy/pi/docker-compose.prod.yml up -d
#
# L'image applicative n'est JAMAIS reconstruite sur le Pi : elle est tirée de
# ghcr.io (construite en ARM64 par GitHub Actions). La version déployée est
# pilotée par TAG dans .env (mis à jour par deploy/pi/deploy.sh).

name: plateforme-professeur

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: plateforme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: plateforme
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plateforme -d plateforme"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - interne

  # D2.2 : migrations versionnées appliquées AVANT le démarrage de l'app.
  migrate:
    image: ghcr.io/maheqmn/plateforme-professeur-outils:${TAG:-latest}
    restart: "no"
    environment:
      DATABASE_URL: postgresql://plateforme:${POSTGRES_PASSWORD}@db:5432/plateforme?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - interne

  app:
    image: ghcr.io/maheqmn/plateforme-professeur:${TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://plateforme:${POSTGRES_PASSWORD}@db:5432/plateforme?schema=public
      # D5.3 : Brevo en production. Sans EMAIL_API_KEY, mode console.
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_EXPEDITEUR: ${EMAIL_EXPEDITEUR:-}
      EMAIL_EXPEDITEUR_NOM: ${EMAIL_EXPEDITEUR_NOM:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - stockage-prod:/app/stockage
    # D1.3 : système de fichiers applicatif en lecture seule ; seuls /tmp
    # et le cache Next.js (tmpfs mémoire) restent inscriptibles.
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    # Caddy (compose de la galerie) accède à l'app via le réseau partagé "web".
    # Le port local permet les contrôles depuis le Pi uniquement.
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      interne:
      web:
        aliases:
          - plateforme-app

  # F5.5 : rappels 24 h, exécution horaire (exigence du cahier initial).
  rappels:
    image: ghcr.io/maheqmn/plateforme-professeur-outils:${TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://plateforme:${POSTGRES_PASSWORD}@db:5432/plateforme?schema=public
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_EXPEDITEUR: ${EMAIL_EXPEDITEUR:-}
      EMAIL_EXPEDITEUR_NOM: ${EMAIL_EXPEDITEUR_NOM:-}
    command: ["sh", "-c", "while true; do npx tsx prisma/rappels-email.ts; sleep 3600; done"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - interne

networks:
  interne:
  # Réseau partagé avec le Caddy de la galerie (créé une fois :
  # docker network create web). "external" pour ne pas le gérer ici.
  web:
    external: true

volumes:
  pgdata-prod:
  stockage-prod:
