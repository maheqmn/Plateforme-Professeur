# Staging sur le Raspberry Pi (D4.2, adapté : pas de cluster dédié).
# Mêmes images et manifestes que la production, données séparées, accès
# UNIQUEMENT par tunnel SSH (aucune exposition DNS/TLS nécessaire) :
#
#   ssh -N -L 3001:localhost:3001 pi@le-pi
#   → http://localhost:3001
#
# Déployé automatiquement à chaque push sur main par GitHub Actions ;
# le seed (profil "seed") sert à peupler la recette.
# Version pilotée par TAG dans .env.staging (mis à jour par deploy.sh).

name: plateforme-staging

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: plateforme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env.staging}
      POSTGRES_DB: plateforme
    volumes:
      - pgdata-staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plateforme -d plateforme"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    image: ghcr.io/maheqmn/plateforme-professeur-outils:${TAG:-latest}
    restart: "no"
    environment:
      DATABASE_URL: postgresql://plateforme:${POSTGRES_PASSWORD}@db:5432/plateforme?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ghcr.io/maheqmn/plateforme-professeur:${TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://plateforme:${POSTGRES_PASSWORD}@db:5432/plateforme?schema=public
      # Pas d'EMAIL_API_KEY en staging : les emails restent en mode console
      # (lisibles via docker compose logs app), aucun envoi réel.
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - stockage-staging:/app/stockage
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    ports:
      - "127.0.0.1:3001:3000"

  seed:
    image: ghcr.io/maheqmn/plateforme-professeur-outils:${TAG:-latest}
    restart: "no"
    profiles: ["seed"]
    environment:
      DATABASE_URL: postgresql://plateforme:${POSTGRES_PASSWORD}@db:5432/plateforme?schema=public
    command: ["npx", "tsx", "prisma/seed.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  rappels:
    image: ghcr.io/maheqmn/plateforme-professeur-outils:${TAG:-latest}
    restart: unless-stopped
    profiles: ["rappels"]
    environment:
      DATABASE_URL: postgresql://plateforme:${POSTGRES_PASSWORD}@db:5432/plateforme?schema=public
    command: ["sh", "-c", "while true; do npx tsx prisma/rappels-email.ts; sleep 3600; done"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata-staging:
  stockage-staging:
