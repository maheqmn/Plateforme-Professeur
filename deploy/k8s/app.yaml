# Application Next.js (image « app », sortie standalone, D1.1-D1.3).
# 2 replicas + RollingUpdate maxUnavailable=0 : zéro coupure visible pendant
# un déploiement (D8.2) — les nouveaux pods ne passent en Ready qu'une fois le
# HEALTHCHECK /api/sante au vert.
#
# Note : le PVC « stockage » est ReadWriteOnce ; sur un cluster mono-noeud
# (k3s) les deux replicas l'utilisent sans problème. Sur un cluster
# multi-noeuds, les deux pods doivent être planifiés sur le meme noeud
# (ou basculer le stockage vers S3 — src/lib/fichiers.ts l'isole deja).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stockage
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: plateforme-app
  labels:
    app: plateforme-app
spec:
  selector:
    app: plateforme-app
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plateforme-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: plateforme-app
  template:
    metadata:
      labels:
        app: plateforme-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: app
          # Nom générique remplacé par kustomize (ghcr.io/...:<sha>).
          image: plateforme-professeur:TAG
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: plateforme-secrets
                  key: DATABASE_URL
            - name: EMAIL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: plateforme-secrets
                  key: EMAIL_API_KEY
                  optional: true
            - name: EMAIL_EXPEDITEUR
              valueFrom:
                secretKeyRef:
                  name: plateforme-secrets
                  key: EMAIL_EXPEDITEUR
                  optional: true
            - name: EMAIL_EXPEDITEUR_NOM
              valueFrom:
                secretKeyRef:
                  name: plateforme-secrets
                  key: EMAIL_EXPEDITEUR_NOM
                  optional: true
          readinessProbe:
            httpGet:
              path: /api/sante
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/sante
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          # D1.3 : durcissement — systeme de fichiers applicatif en lecture
          # seule ; seuls /tmp et le cache Next.js (emptyDir) restent
          # inscriptibles, plus le point de montage /app/stockage.
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: stockage
              mountPath: /app/stockage
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.next/cache
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: stockage
          persistentVolumeClaim:
            claimName: stockage
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
