<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Maquette</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-screen">
  <main class="login-card">
    <div class="login-logo">
      <div class="brand-logo">L</div>
      <h1>La plateforme de votre professeur</h1>
    </div>
    <p class="login-sub">Connectez-vous pour accéder à vos cours, vos messages et votre calendrier.</p>

    <form>
      <div class="field">
        <label for="email">Votre adresse email</label>
        <input type="email" id="email" name="email" placeholder="ex. marie.dupont@exemple.fr" autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Votre mot de passe</label>
        <input type="password" id="password" name="password" placeholder="Votre mot de passe" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-large">Se connecter</button>
    </form>

    <div class="login-links">
      <a class="link" href="#">Première visite ? Utilisez votre invitation</a>
      <a class="link" href="#">Mot de passe oublié</a>
      <a class="link" href="#">Espace professeur</a>
    </div>

    <p class="login-legal">
      <a href="#">Mentions légales</a> &middot; <a href="#">Politique de confidentialité</a>
    </p>
  </main>
  <script src="js/maquette.js"></script>
</body>
</html>
