# D1.6 : environnement local conteneurisé — application + PostgreSQL 16 +
# Mailpit (faux SMTP), dans les mêmes conditions que la production.
#
#   Démarrage simple       : docker compose up -d --build
#   Avec le contenu d'essai : docker compose --profile seed up -d --build
#   + rappels 24 h (F5.5)   : ajouter --profile rappels
#
# L'application démarre seulement après que le service "migrate" a appliqué
# les migrations (prisma migrate deploy) avec succès.

name: plateforme-professeur

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plateforme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plateforme}
      POSTGRES_DB: ${POSTGRES_DB:-plateforme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # D2.2 : migrations versionnées appliquées avant chaque démarrage de l'app.
  migrate:
    build:
      context: .
      target: outils
    image: plateforme-professeur-outils:local
    environment: &base-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-plateforme}:${POSTGRES_PASSWORD:-plateforme}@db:5432/${POSTGRES_DB:-plateforme}?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: app
    image: plateforme-professeur:local
    environment:
      <<: *base-env
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - stockage:/app/stockage
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Contenu d'exemple (compte professeur, cours, articles) — recette uniquement.
  seed:
    build:
      context: .
      target: outils
    image: plateforme-professeur-outils:local
    profiles: ["seed"]
    environment:
      <<: *base-env
    command: ["npx", "tsx", "prisma/seed.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # F5.5 : rappels 24 h, exécution horaire (équivalent local du CronJob K8s).
  rappels:
    build:
      context: .
      target: outils
    image: plateforme-professeur-outils:local
    profiles: ["rappels"]
    environment:
      <<: *base-env
    command: ["sh", "-c", "while true; do npx tsx prisma/rappels-email.ts; sleep 3600; done"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Faux service SMTP : interface web http://localhost:8025, SMTP interne :1025.
  # Utilisé dès que src/lib/email.ts est branché sur un envoi SMTP (8.1).
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  pgdata:
  stockage:
